name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check every module
        run: |
          python -m compileall -q .
          echo "all modules compile"

      - name: Import the service modules
        run: |
          python - <<'PY'
          import sys, pathlib
          sys.path.insert(0, ".")
          sys.path.insert(0, "vendor")
          import config, metadata, pdfsource, zotero_api, manage, service
          # a fresh checkout has no config.json; defaults must still load
          cfg = config.load_config()
          assert cfg["service"]["port"] == 8787
          assert config.temp_collection_name() == "00 TEMP"
          print("modules import and defaults load")
          PY

      - name: Config must survive a UTF-8 BOM
        run: |
          python - <<'PY'
          import json, pathlib, sys, tempfile, os
          sys.path.insert(0, ".")
          import config
          tmp = pathlib.Path(tempfile.mkdtemp())
          cfg = tmp / "config.json"
          body = {"service": {"port": 9999}, "translator": {"openai_model": "x"}}
          cfg.write_text(json.dumps(body), encoding="utf-8-sig")  # BOM on purpose
          config.CONFIG_FILE = cfg
          out = config.load_config()
          assert config.port() == 9999, "BOM broke config parsing"
          assert out["translator"]["openai_model"] == "x"
          print("BOM tolerated")
          PY

      - name: Zotero probe must never block the health endpoint
        run: |
          python - <<'PY'
          import time, sys
          sys.path.insert(0, ".")
          import zotero_api

          # Nothing listens on Zotero's port in CI. The probe has to fail fast:
          # /api/health is polled every couple of seconds by the extension, so a
          # slow probe here stalls the whole UI.
          t0 = time.time()
          assert zotero_api.is_running() is False
          elapsed = time.time() - t0
          assert elapsed < 2.5, f"is_running() took {elapsed:.1f}s"
          print(f"is_running() returned False in {elapsed:.2f}s")

          # ...and repeated calls must be served from the cache.
          zotero_api.is_running_cached()   # warm the cache first
          t0 = time.time()
          for _ in range(20):
              zotero_api.is_running_cached()
          cached = time.time() - t0
          assert cached < 0.5, f"cached path took {cached:.2f}s for 20 calls"
          print(f"20 cached calls in {cached:.3f}s")
          PY

      - name: Launcher exits quietly when the service is already up
        run: |
          python - <<'PY'
          import socket, subprocess, sys, threading, time, pathlib
          # Occupy a port, point the config at it, and check run_service.pyw
          # returns immediately instead of trying to bind a second server.
          srv = socket.socket()
          srv.bind(("127.0.0.1", 0))
          srv.listen(1)
          port = srv.getsockname()[1]

          cfg = pathlib.Path("config.json")
          cfg.write_text('{"service": {"port": %d}}' % port, encoding="utf-8")
          try:
              proc = subprocess.run(
                  [sys.executable, "run_service.pyw"],
                  capture_output=True, text=True, timeout=20,
              )
              assert proc.returncode == 0, proc.stderr[-300:]
              print("launcher exited cleanly while the port was busy")
          finally:
              cfg.unlink(missing_ok=True)
              srv.close()
          PY

      - name: Provider errors are translated into advice, not raw traces
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from service import explain_endpoint_error

          cases = [
              ("502 upstream_server_error", "502"),
              ("Error code: 502 - provider unreachable", "模型名"),
              ("HTTP 401 Unauthorized", "密钥"),
              ("429 rate limit exceeded", "qps"),
          ]
          for raw, expect in cases:
              out = explain_endpoint_error(raw)
              assert expect in out, f"{raw!r} -> {out!r} lacks {expect!r}"
              assert raw not in out or "502" in raw, "raw error leaked through"
          print("endpoint errors are explained")
          PY

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check the extension
        run: |
          for f in extension/background.js extension/content.js extension/popup.js; do
            node --check "$f"
            echo "ok $f"
          done

      - name: manifest.json is valid and self-consistent
        run: |
          python3 - <<'PY'
          import json, pathlib
          ext = pathlib.Path("extension")
          m = json.loads((ext / "manifest.json").read_text(encoding="utf-8"))
          assert m["manifest_version"] == 3
          for size in ("16", "32", "48", "128"):
              p = ext / m["icons"][size]
              assert p.is_file(), f"missing icon {p}"
          for js in m["content_scripts"][0]["js"]:
              assert (ext / js).is_file(), f"missing {js}"
          # the generated config must never be committed, only its template
          assert not (ext / "config.js").exists(), "config.js is generated, not committed"
          assert (ext / "config.js.example").is_file(), "missing config.js.example"
          print("manifest ok")
          PY

      - name: background script degrades when config.js is absent
        run: |
          python3 - <<'PY'
          import pathlib
          bg = (pathlib.Path("extension") / "background.js").read_text(encoding="utf-8")
          # a fresh clone has no config.js, so importScripts must be guarded
          assert "try {" in bg and "catch" in bg, "importScripts is not guarded"
          assert "NOT_SET_UP" in bg, "missing the unconfigured message"
          print("graceful degradation present")
          PY
